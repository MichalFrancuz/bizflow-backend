# BizFlow isolated test database
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bizflow_test
spring.datasource.username=bizflow_test_user
spring.datasource.password=${BIZFLOW_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema validation - no automatic Hibernate changes
spring.jpa.hibernate.ddl-auto=validate

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# CORS
app.cors.allowed-origin=http://localhost:5173

# JWT configuration
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.access-token-expiration=900