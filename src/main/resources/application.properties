spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fullstack_db}
spring.datasource.username=${DB_USERNAME:fullstack_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CORS configuration
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900}

# Refresh token configuration
app.jwt.refresh-token-expiration=604800

# Refresh token cookie configuration
app.jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}